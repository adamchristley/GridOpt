[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridopt"
version = "0.1.0"
description = "Day-ahead load forecasting and battery dispatch optimization for commercial electricity demand"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Adam Christley"}]
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
gridopt = "gridopt.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
